name: mlops-lab-07
channels:
  - conda-forge
dependencies:
  - python=3.12 # mlserver does not support 3.13 yet
  - pip
  - uvloop<0.22
  - matplotlib
  - pip:
    - mlserver==1.7.1
    - mlserver-huggingface==1.7.1
    - timm==1.0.30
    - torch==2.14.0
    - transformers==4.53.3 # alibi-detect requires <5, optimum (mlserver-huggingface) caps at 4.53
    - foolbox==3.3.4
    - dvc==3.67.1
    - jupyterlab==4.6.4
    - tf-keras==2.21.0
    - alibi-detect==0.13.0
