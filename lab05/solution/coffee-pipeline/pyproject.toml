[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "coffee_pipeline"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "kedro~=1.6.0",
    "kedro-datasets[pandas-csvdataset,pickle-pickledataset]",
    "scikit-learn",
    "torch",
    "transformers",
    "xgboost",
]

[project.scripts]
coffee-pipeline = "coffee_pipeline.__main__:main"

[project.entry-points."kedro.hooks"]

[tool.setuptools.dynamic.version]
attr = "coffee_pipeline.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "coffee_pipeline"
project_name = "coffee-pipeline"
kedro_init_version = "1.6.0"
tools = "['None']"
example_pipeline = "False"
source_dir = "src"
